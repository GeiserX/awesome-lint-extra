name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Must equal pyproject.toml. Required when running from a branch."
        required: false
        type: string

# Deny by default; the publish job grants exactly what it needs.
permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    # The PyPI trusted publisher is registered for this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/awesome-lint-extra/

    permissions:
      contents: read    # actions/checkout
      id-token: write   # PyPI trusted publishing (OIDC), no API token stored

    steps:
      - name: Check out the tree being released
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # the build installs packages; keep the token out of .git/config

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # v1.1.0 and v1.1.1 were tagged and released on GitHub but never reached
      # PyPI, because nothing published them. A version that does not match
      # its tag must stop the run loudly.
      - name: Verify the version matches the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${REF_TYPE}" = "tag" ]; then
            EXPECTED="${REF_NAME#v}"
            SOURCE="tag ${REF_NAME}"
          else
            EXPECTED="${INPUT_VERSION:-}"
            SOURCE="workflow_dispatch input"
            if [ -z "${EXPECTED}" ]; then
              echo "::error::Manual runs from a branch must supply the 'version' input."
              exit 1
            fi
          fi

          ACTUAL="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "expected (${SOURCE}): ${EXPECTED}"
          echo "pyproject.toml:       ${ACTUAL}"

          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::Version mismatch: ${SOURCE} says '${EXPECTED}' but pyproject.toml says '${ACTUAL}'. Refusing to publish."
            exit 1
          fi
          echo "Version check passed: ${ACTUAL}"

      - name: Install build tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m build
          ls -l dist/

      - name: Check package metadata
        run: |
          set -euo pipefail
          python -m twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
